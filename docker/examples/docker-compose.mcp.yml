# Evolution GO built from this repository, with the MCP server (/mcp), its
# OAuth authorization server and the SQLite message store enabled.
#
#   cd docker/examples
#   GLOBAL_API_KEY=... POSTGRES_PASSWORD=... docker compose -f docker-compose.mcp.yml up -d --build
#
# The API is published on 127.0.0.1 only: put a tunnel or reverse proxy in
# front of it (see docs/wiki/recursos-avancados/mcp-server.md).

services:
  evolution-go:
    build:
      context: ../..
    image: evolution-go:mcp
    container_name: evolution-go
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${SERVER_PORT:-4010}:${SERVER_PORT:-4010}"
    environment:
      SERVER_PORT: "${SERVER_PORT:-4010}"
      CLIENT_NAME: "evolution"
      TZ: "${TZ:-America/Sao_Paulo}"
      GLOBAL_API_KEY: "${GLOBAL_API_KEY:?set GLOBAL_API_KEY}"

      POSTGRES_AUTH_DB: "postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/evogo_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evogo_users?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "false"

      WADEBUG: "INFO"
      LOGTYPE: "console"
      CONNECT_ON_STARTUP: "true"
      WEBHOOK_FILES: "false"
      OS_NAME: "Linux"
      EVENT_IGNORE_STATUS: "true"
      MINIO_ENABLED: "false"

      # MCP + OAuth + message history
      MCP_ENABLED: "true"
      MESSAGE_STORE_ENABLED: "true"
      MESSAGE_STORE_RETENTION_DAYS: "${MESSAGE_STORE_RETENTION_DAYS:-0}"
      # Public https origin of this API. Optional behind cloudflared (it is
      # derived from the forwarded headers), but pinning it is safer.
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:-}"
    volumes:
      - evolution_data:/app/dbdata
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  evolution_data:
  postgres_data:
